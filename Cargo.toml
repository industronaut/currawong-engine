[package]
name = "currawong"
version = "0.1.0"
edition = "2024"
description = "A game engine written in Rust, named after the Australian bird."
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = ["render"]
# Render side: window, GPU, View, run(). Disable for headless sim-only builds.
render = ["dep:bytemuck", "dep:image", "dep:pollster", "dep:wgpu", "dep:winit", "glam/bytemuck"]
# egui-based debug UI overlay. Implies `render`. Adds `View::ui` opt-in hook.
egui = ["render", "dep:egui", "dep:egui-winit", "dep:egui-wgpu"]
# yakui-based game UI. Implies `render`. Adds `View::game_ui` opt-in hook.
# Independent of `egui`; both can be enabled simultaneously.
yakui = ["render", "dep:yakui", "dep:yakui-wgpu", "dep:yakui-winit"]

[dependencies]
glam = "0.32.1"
# `serde` + `ron` back the `data` module's definitions pipeline. Pure data
# crates with no platform concerns — kept as base deps so `src/data/` always
# compiles, including under `--no-default-features`.
serde = { version = "1", features = ["derive"] }
ron = "0.8"
bytemuck = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
pollster = { version = "0.4.0", optional = true }
wgpu = { version = "29.0.3", optional = true }
winit = { version = "0.30.13", optional = true }
egui = { version = "0.34.2", optional = true }
egui-winit = { version = "0.34.2", optional = true }
egui-wgpu = { version = "0.34.2", optional = true }
# Pinned to a main-branch commit because published yakui-wgpu 0.3.0 still uses
# wgpu 22; main has been on wgpu 29 since the bumping-various-dependencies PR.
# Move to a real version when 0.4 (or whatever the post-wgpu-29 release is)
# ships on crates.io.
yakui = { git = "https://github.com/SecondHalfGames/yakui", rev = "322a27275f86c4723dbbc86ade075c98512aea1b", optional = true }
yakui-wgpu = { git = "https://github.com/SecondHalfGames/yakui", rev = "322a27275f86c4723dbbc86ade075c98512aea1b", optional = true }
yakui-winit = { git = "https://github.com/SecondHalfGames/yakui", rev = "322a27275f86c4723dbbc86ade075c98512aea1b", optional = true }

[[example]]
name = "assets"
required-features = ["render"]

[[example]]
name = "campfire"
required-features = ["render"]

[[example]]
name = "materials"
required-features = ["render"]

[[example]]
name = "trees"
required-features = ["render"]

[[example]]
name = "textured_pbr"
required-features = ["render"]

[[example]]
name = "multi_zone"
required-features = ["render"]

[[example]]
name = "hex_terrain"
required-features = ["render"]

[[example]]
name = "slope_terrain"
required-features = ["render"]

[[example]]
name = "lumber_camp"
required-features = ["yakui"]

[[example]]
name = "headless"
